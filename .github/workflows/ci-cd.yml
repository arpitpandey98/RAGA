name: RAGA CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Worker changes
        id: worker_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          echo "Comparing $BASE_SHA to ${{ github.sha }}"

          git diff --name-only "$BASE_SHA" "${{ github.sha }}" > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          if grep -Eq '^(RAGA.DocumentProcessor/|RAGA.Application/|RAGA.Domain/|RAGA.Infrastructure/|Dockerfile.worker$)' changed_files.txt; then
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
            echo "Worker changes detected."
          else
            echo "worker_changed=false" >> "$GITHUB_OUTPUT"
            echo "No Worker changes detected."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RAGA.slnx

      - name: Build
        run: dotnet build RAGA.slnx --configuration Release --no-restore

      - name: Azure Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          az acr login --name ragaregistry01

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker build \
            -f Dockerfile \
            -t ragaregistry01.azurecr.io/raga-api:${{ github.sha }} \
            .

      - name: Build Worker Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.worker_changes.outputs.worker_changed == 'true'
        run: |
          docker build \
            -f Dockerfile.worker \
            -t ragaregistry01.azurecr.io/raga-document-processor:${{ github.sha }} \
            .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push ragaregistry01.azurecr.io/raga-api:${{ github.sha }}

      - name: Push Worker Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.worker_changes.outputs.worker_changed == 'true'
        run: |
          docker push ragaregistry01.azurecr.io/raga-document-processor:${{ github.sha }}

      - name: Deploy to Azure Container App
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          az containerapp update \
            --name raga-api \
            --resource-group raga-rg \
            --image ragaregistry01.azurecr.io/raga-api:${{ github.sha }}